<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Moh Chat | دردشة عربية بدون تسجيل</title>
  <link rel="stylesheet" href="index.css">
  <!-- الإضافة الوحيدة: لينك لملف favicon.ico.png -->
  <link rel="icon" href="/favicon.ico.png" type="image/png">
  <meta name="description" content="Moh Chat موقع دردشة عربية بدون تسجيل، تواصل مع مستخدمين عرب بسهولة وأمان. شات عربي مجاني وسريع.">
  
  <!-- Minimal structural CSS for the slider (No visual styling applied) -->
  <style>
    .auth-container {
      position: relative;
      width: 100%;
      max-width: 500px; /* Adjust as needed for your design */
      margin: 0 auto;
      overflow: hidden;
      /* Background and shadows will be handled by your CSS */
    }

    .auth-slider {
      display: flex;
      width: 200%; /* Two panels side by side */
      transition: transform 0.5s ease-in-out;
    }

    .auth-form {
      width: 50%;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* No visual styling here */
    }

    /* RTL specific sliding logic */
    .auth-slider.show-signup {
      transform: translateX(50%);
    }

    /* Form inner alignment */
    .auth-form form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-form input, .auth-form select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }

    .auth-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
    }

    .avatar-upload-container {
      text-align: center;
      margin-bottom: 10px;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ccc;
      object-fit: cover;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header with Logo (Kept exactly as original) -->
    <div style="text-align: center; margin-bottom: 20px;">
      <img src="/favicon.ico.png" alt="Logo" style="width: 80px; height: 80px; border-radius: 10px; margin-bottom: 10px;">
      <h1 style="margin: 0;">chat moh</h1>
    </div>

    <!-- Original Welcome Text -->
    <p style="margin-top: 15px; color: #333; font-size: 14px; text-align: center;">
      مرحباً بك في شات عربي! أنشئ حسابك بسهولة...
    </p>

    <!-- ========== NEW AUTH SLIDER SECTION ========== -->
    <div class="auth-container" id="authContainer">
      <div class="auth-slider" id="authSlider">

        <!-- Login Panel -->
        <div class="auth-form" id="loginPanel">
          <form id="loginForm">
            <h2>LOGIN</h2>
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <label style="text-align: right; display: block;">
              <input type="checkbox" id="remember"> تذكرني
            </label>
            <button type="submit">تسجيل الدخول</button>
            
            <!-- Toggle to Sign Up -->
            <button type="button" class="auth-toggle-btn" id="goToRegister">
              ليس لديك حساب؟ تسجيل جديد
            </button>
          </form>
        </div>

        <!-- Register Panel -->
        <div class="auth-form" id="registerPanel">
          <form id="registerForm">
            <h2>SIGN UP</h2>
            
            <!-- Avatar Upload (New element matching the image) -->
            <div class="avatar-upload-container">
              <label for="regAvatar" style="cursor: pointer;">
                <img id="regAvatarPreview" class="avatar-preview" src="https://via.placeholder.com/80" alt="Avatar">
                <div style="font-size: 12px; margin-top: 5px;">إضافة صورة +</div>
              </label>
              <input type="file" id="regAvatar" accept="image/*" style="display: none;">
            </div>

            <input type="text" id="regUsername" placeholder="اسم المستخدم" required>
            <input type="password" id="regPassword" placeholder="كلمة المرور" required>
            
            <!-- Email Field (New element matching the image) -->
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
            
            <!-- Country Select (New element matching the image) -->
            <select id="regCountry" required>
              <option value="" disabled selected>اختر البلد</option>
              <option value="Algeria">🇩🇿 الجزائر</option>
              <option value="Morocco">🇲🇦 المغرب</option>
              <option value="Tunisia">🇹🇳 تونس</option>
              <option value="Egypt">🇪🇬 مصر</option>
              <option value="Saudi Arabia">🇸🇦 السعودية</option>
              <option value="UAE">🇦🇪 الإمارات</option>
              <option value="France">🇫🇷 فرنسا</option>
              <option value="USA">🇺🇸 أمريكا</option>
            </select>

            <button type="submit">تسجيل</button>
            
            <!-- Toggle back to Login -->
            <button type="button" class="auth-toggle-btn" id="goToLogin">
              لديك حساب بالفعل؟ تسجيل الدخول
            </button>

            <!-- Original explanatory text -->
            <p style="margin-top: 15px; color: #333; font-size: 14px; text-align: center;">
              مرحباً بك في شات عربي! أنشئ حسابك بسهولة لتتمكن من الدخول والمحادثة مع الآخرين. تسجيلك يساعدنا على تقديم تجربة أفضل وآمنة للجميع.
            </p>
          </form>
        </div>

      </div>
    </div>
    <!-- ========== END AUTH SLIDER SECTION ========== -->

  </div>

  <script>
    // ========== Slider Logic ==========
    const slider = document.getElementById('authSlider');
    const goToRegister = document.getElementById('goToRegister');
    const goToLogin = document.getElementById('goToLogin');

    goToRegister.addEventListener('click', () => {
      slider.classList.add('show-signup');
    });

    goToLogin.addEventListener('click', () => {
      slider.classList.remove('show-signup');
    });

    // ========== Avatar Preview Logic ==========
    const regAvatarInput = document.getElementById('regAvatar');
    const regAvatarPreview = document.getElementById('regAvatarPreview');

    regAvatarInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          regAvatarPreview.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
  
  <script src="index.js"></script>
</body>
</html>
