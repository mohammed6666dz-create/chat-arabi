<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Moh Chat | دردشة عربية بدون تسجيل</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="/favicon.ico.png" type="image/png">
  <meta name="description" content="Moh Chat موقع دردشة عربية بدون تسجيل، تواصل مع مستخدمين عرب بسهولة وأمان. شات عربي مجاني وسريع.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    
    <!-- ========== LEFT PANEL ========== -->
    <div class="left-panel">
      <div class="logo-icon">
        <i class="fas fa-comments"></i>
      </div>
      <h1>chat moh</h1>
      <p>مرحباً بك في شات عربي!<br>أنشئ حسابك بسهولة...</p>
      
      <div class="toggle-tabs">
        <button type="button" id="tabLogin" class="active">LOGIN</button>
        <button type="button" id="tabSignup">SIGN UP</button>
      </div>
    </div>

    <!-- ========== RIGHT PANEL ========== -->
    <div class="right-panel" id="formPanel">
      
      <!-- Login Form -->
      <form id="loginForm">
        <h2>LOGIN</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        
        <div class="checkbox-wrapper">
          <input type="checkbox" id="remember">
          <label for="remember">Remember Me</label>
        </div>

        <button type="submit">SIGN IN</button>
        <a href="#" id="forgotPasswordLink">Forgot Password?</a>
      </form>

      <!-- Sign Up Form -->
      <form id="registerForm" style="display: none;">
        <h2>SIGN UP</h2>
        
        <div class="avatar-upload-container">
          <label for="regAvatar" class="avatar-upload-label">
            <img id="regAvatarPreview" class="avatar-preview" src="https://via.placeholder.com/80" alt="Avatar">
            <div style="margin-top: 5px;">Upload Avatar +</div>
          </label>
          <input type="file" id="regAvatar" accept="image/*" style="display: none;">
        </div>

        <input type="text" id="regUsername" placeholder="Username" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        
        <select id="regCountry" required>
          <option value="" disabled selected>Country</option>
          <option value="Algeria">🇩🇿 Algeria</option>
          <option value="Morocco">🇲🇦 Morocco</option>
          <option value="Tunisia">🇹🇳 Tunisia</option>
          <option value="Egypt">🇪🇬 Egypt</option>
          <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
          <option value="UAE">🇦🇪 UAE</option>
          <option value="France">🇫🇷 France</option>
          <option value="USA">🇺🇸 USA</option>
        </select>

        <button type="submit">CREATE ACCOUNT</button>
      </form>

    </div>
  </div>

  <script>
    const container = document.querySelector('.container');
    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    function showLogin() {
      container.classList.remove('show-signup');
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    }

    function showSignup() {
      container.classList.add('show-signup');
      tabLogin.classList.remove('active');
      tabSignup.classList.add('active');
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
    }

    tabLogin.addEventListener('click', showLogin);
    tabSignup.addEventListener('click', showSignup);

    // Avatar Preview
    const regAvatarInput = document.getElementById('regAvatar');
    const regAvatarPreview = document.getElementById('regAvatarPreview');
    regAvatarInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          regAvatarPreview.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
  
  <script src="index.js"></script>
</body>
</html>
